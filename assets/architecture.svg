<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#57606a"/>
    </marker>
    <style>
      .box { fill:#f6f8fa; stroke:#d0d7de; stroke-width:1.5; rx:8; }
      .label { fill:#1f2328; font-size:13.5px; }
      .num { fill:#0969da; font-size:12px; font-weight:bold; }
      .arrow { stroke:#57606a; stroke-width:1.6; marker-end:url(#arrow); }
      .note { fill:#57606a; font-size:12px; }
    </style>
  </defs>

  <!-- 1 -->
  <rect class="box" x="180" y="20" width="400" height="44"/>
  <circle cx="152" cy="42" r="13" fill="#0969da"/>
  <text class="num" x="152" y="46" text-anchor="middle" fill="#ffffff">1</text>
  <text class="label" x="380" y="47" text-anchor="middle">docs/  —  .pdf  .md  .txt</text>

  <line class="arrow" x1="380" y1="64" x2="380" y2="88"/>

  <!-- 2 -->
  <rect class="box" x="180" y="90" width="400" height="44"/>
  <circle cx="152" cy="112" r="13" fill="#0969da"/>
  <text class="num" x="152" y="116" text-anchor="middle" fill="#ffffff">2</text>
  <text class="label" x="380" y="117" text-anchor="middle">ingest.py — split at headings, crop screenshots</text>

  <line class="arrow" x1="380" y1="134" x2="380" y2="158"/>

  <!-- 3 -->
  <rect class="box" x="180" y="160" width="400" height="44"/>
  <circle cx="152" cy="182" r="13" fill="#0969da"/>
  <text class="num" x="152" y="186" text-anchor="middle" fill="#ffffff">3</text>
  <text class="label" x="380" y="187" text-anchor="middle">nomic-embed-text — embed every chunk</text>

  <line class="arrow" x1="380" y1="204" x2="380" y2="228"/>

  <!-- 4 -->
  <rect class="box" x="180" y="230" width="400" height="44"/>
  <circle cx="152" cy="252" r="13" fill="#0969da"/>
  <text class="num" x="152" y="256" text-anchor="middle" fill="#ffffff">4</text>
  <text class="label" x="380" y="257" text-anchor="middle">Chroma (vectors)  +  BM25 (keywords)</text>

  <line class="arrow" x1="380" y1="274" x2="380" y2="298"/>

  <!-- 5 -->
  <rect class="box" x="180" y="300" width="400" height="44"/>
  <circle cx="152" cy="322" r="13" fill="#0969da"/>
  <text class="num" x="152" y="326" text-anchor="middle" fill="#ffffff">5</text>
  <text class="label" x="380" y="327" text-anchor="middle">hybrid search + rank fusion → top-k passages</text>

  <line class="arrow" x1="380" y1="344" x2="380" y2="368"/>

  <!-- 6 -->
  <rect class="box" x="180" y="370" width="400" height="44"/>
  <circle cx="152" cy="392" r="13" fill="#0969da"/>
  <text class="num" x="152" y="396" text-anchor="middle" fill="#ffffff">6</text>
  <text class="label" x="380" y="397" text-anchor="middle">llama3.1:8b (Ollama) — grounded answer [n]</text>

  <line class="arrow" x1="380" y1="414" x2="380" y2="438"/>

  <!-- 7 -->
  <rect class="box" x="180" y="440" width="400" height="44"/>
  <circle cx="152" cy="462" r="13" fill="#0969da"/>
  <text class="num" x="152" y="466" text-anchor="middle" fill="#ffffff">7</text>
  <text class="label" x="380" y="467" text-anchor="middle">Streamlit UI — answer, citations, screenshots</text>

  <!-- local-only badge -->
  <rect x="608" y="160" width="128" height="254" rx="10" fill="none" stroke="#8250df"
        stroke-width="1.4" stroke-dasharray="5 4"/>
  <text class="note" x="672" y="150" text-anchor="middle" fill="#8250df">runs locally</text>
  <text class="note" x="672" y="290" text-anchor="middle" fill="#8250df"
        transform="rotate(90 672 290)">no API keys · no cloud</text>

  <text class="note" x="380" y="522" text-anchor="middle">Documents, index and screenshots never leave the machine.</text>
  <text class="note" x="380" y="544" text-anchor="middle">Questions are typed into the Streamlit app (step 5 feeds step 6).</text>
</svg>
